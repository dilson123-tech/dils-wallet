name: PIX send — concurrency (PostgreSQL)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/pix-concurrency-postgres.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/pix-concurrency-postgres.yml"
  workflow_dispatch:

jobs:
  concurrency-postgres:
    name: pix-send concurrency (Postgres real, efêmero)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.12
        env:
          POSTGRES_USER: auratest
          POSTGRES_PASSWORD: auratest
          POSTGRES_DB: auratest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U auratest -d auratest_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PIX_CONCURRENCY_TEST_DATABASE_URL: "postgresql+psycopg2://auratest:auratest@localhost:5432/auratest_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-prod.txt
            backend/requirements-test.txt

      - name: Install backend deps (constraints reproduzíveis de produção)
        run: |
          python -m pip install -r requirements.txt -c constraints-prod.txt

      - name: Install test-only deps (pytest, pinado, isolado da produção)
        run: |
          python -m pip install -r requirements-test.txt

      - name: Run PIX send concurrency test (PostgreSQL real, descartável)
        run: |
          python -m pytest tests/test_pix_send_concurrency_postgres.py -v
