name: CI — dils-wallet

on:
  workflow_dispatch:
  push:
    branches: [main, lab/**, chore/**, feat/**, fix/**]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-prod.txt

      - name: Sanity compile
        run: python -m compileall .

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Chave fictícia só para testes (não é secret). Sem DATABASE_URL:
      # os testes usam SQLite em memória/temporário; os testes PostgreSQL
      # se pulam sozinhos e seguem cobertos por pix-concurrency-postgres.yml.
      SECRET_KEY: ci-pytest-dummy-secret-0123456789
      JWT_SECRET: ci-pytest-dummy-secret-0123456789
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-prod.txt
            backend/requirements-test.txt

      - name: Install deps
        run: |
          python -m pip install -r requirements.txt -c constraints-prod.txt
          python -m pip install -r requirements-test.txt

      - name: Run backend test suite
        run: python -m pytest tests -q -rs -p no:cacheprovider

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurea-gold-client
    steps:
      - uses: actions/checkout@v6

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aurea-gold-client/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

  smoke-prod:

    runs-on: ubuntu-latest

    needs: [backend-build, client-build]

    if: ${{ github.ref == 'refs/heads/main' }}

    env:

      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}   # ex: https://...railway.app

      HEALTH_TOKEN:   ${{ secrets.HEALTH_TOKEN }}     # header de health

      BEARER_TOKEN:   ${{ secrets.BEARER_TOKEN }}     # opcional p/ endpoints protegidos

    steps:

      - name: Gate smoke-prod (secrets present?)

        id: gate

        run: |

          if [ -n "${SMOKE_BASE_URL:-}" ] && [ -n "${HEALTH_TOKEN:-}" ]; then

            echo "run=true" >> "$GITHUB_OUTPUT"

          else

            echo "run=false" >> "$GITHUB_OUTPUT"

            echo "SMOKE-PROD: SKIP (missing SMOKE_BASE_URL/HEALTH_TOKEN secrets)"

          fi


      - name: Healthz

        if: ${{ steps.gate.outputs.run == 'true' }}

        run: |

          set -e

          echo ">> /healthz"

          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \

            -H "X-Health-Token: ${HEALTH_TOKEN}" \

            "${SMOKE_BASE_URL}/healthz" | jq .


      - name: Auth sanity (opcional)

        if: ${{ steps.gate.outputs.run == 'true' && env.BEARER_TOKEN != '' }}

        run: |

          echo ">> /api/v1/transactions/balance"

          curl -fsS -H "Authorization: Bearer ${BEARER_TOKEN}" \

            "${SMOKE_BASE_URL}/api/v1/transactions/balance" | jq .

  lint:
    name: lint
    needs: [backend-build, client-build, backend-tests]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Gate lint -> backend-build + client-build + backend-tests
        run: |
          echo "backend-build=${{ needs.backend-build.result }}"
          echo "client-build=${{ needs.client-build.result }}"
          echo "backend-tests=${{ needs.backend-tests.result }}"
          test "${{ needs.backend-build.result }}" = "success"
          test "${{ needs.client-build.result }}" = "success"
          test "${{ needs.backend-tests.result }}" = "success"
