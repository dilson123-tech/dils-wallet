name: Smoke — PIX Idempotency

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      API_BASE: http://127.0.0.1:8090
      AUREA_USER: customer@aurea.local
      AUREA_PASS: dev
      SECRET_KEY: ci-local-pix-idempotency-secret-1234567890
      DOCS_PUBLIC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -c constraints-prod.txt
          sudo apt-get update -y
          sudo apt-get install -y jq uuid-runtime

      - name: Init local database + seed customer balance
        run: |
          python -m app.utils.init_db
          python - <<'PY'
          from decimal import Decimal

          from app.database import SessionLocal
          from app.models.pix_ledger import PixLedger
          from app.models import User
          from app.utils.security import hash_password

          db = SessionLocal()
          try:
              user = db.query(User).filter(User.email == "customer@aurea.local").first()
              if user is None:
                  user = User(
                      email="customer@aurea.local",
                      full_name="customer",
                      hashed_password=hash_password("dev"),
                      role="customer",
                  )
                  db.add(user)
                  db.flush()
              else:
                  user.hashed_password = hash_password("dev")
                  user.role = "customer"

              db.add(PixLedger(user_id=user.id, kind="credit", amount=Decimal("100.00")))
              db.commit()
          finally:
              db.close()
          PY

      - name: Start API
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8090 --log-level info > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$API_BASE/openapi.json" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done

          code=$(curl -sS -o /dev/null -w "%{http_code}" "$API_BASE/openapi.json" || true)
          if [ "$code" != "200" ]; then
            echo "FAIL: API não subiu"
            tail -n 200 uvicorn.log || true
            exit 1
          fi

      - name: Run PIX idempotency smoke
        run: bash scripts/smoke_pix_idempotency.sh

      - name: Stop API + logs
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          echo "---- uvicorn.log (tail) ----"
          tail -n 200 uvicorn.log || true
